- name: Check out the repository
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ repo_version }}"
    force: true
  notify: Restart shopflow

- name: Install the systemd unit for the compose stack
  ansible.builtin.template:
    src: shopflow.service.j2
    dest: /etc/systemd/system/shopflow.service
    mode: "0644"
  notify: Restart shopflow

- name: Build images and start the stack
  ansible.builtin.systemd:
    name: shopflow
    daemon_reload: true
    enabled: true
    state: started

# Handlers run at the END of the play by default. Without this flush, a code-update run would
# checkout the new revision (notifying Restart), then health-gate the service that is STILL running
# the OLD code (state: started is a no-op when already active), pass, and only restart into the new
# version afterwards — unguarded. Flushing here restarts into the new code FIRST, so the readiness
# gate below validates the version we just deployed and a broken deploy fails the play loudly.
- name: Apply any pending restart before the health gate
  ansible.builtin.meta: flush_handlers

- name: Wait for order-service readiness
  ansible.builtin.uri:
    url: http://localhost:8081/actuator/health/readiness
    status_code: 200
  register: shopflow_readiness
  retries: 30
  delay: 10
  until: shopflow_readiness.status == 200
