name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Build & test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # Devops + microservice01 are independent; don't cancel one for the other
      matrix:
        service: [Devops, microservice01]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify
      - name: Docker build (no push)
        # a docker tag must be lowercase, but the matrix value is the directory name (e.g. "Devops")
        run: docker build -t "${SERVICE,,}:ci" .
        env:
          SERVICE: ${{ matrix.service }}

  validate-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary Devops/*.yaml microservice01/*.yaml
