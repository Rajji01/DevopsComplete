# CI/CD for the ShopFlow microservices.
# PR:   test -> validate manifests -> build images + vulnerability scan (no push)
# main: same, then push images to GHCR tagged with the commit SHA, and commit that SHA
#       into k8s/overlays/prod (GitOps: a cluster running Argo CD would pick it up from there)
name: shopflow

on:
  push:
    branches: [main]
    paths: ["shopflow/**", "infra/**", ".github/workflows/shopflow.yml"]
  pull_request:
    paths: ["shopflow/**", "infra/**", ".github/workflows/shopflow.yml"]

# a newer push to the same branch cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: shopflow

jobs:
  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: shopflow/**/target/surefire-reports/

  validate-manifests:
    name: Validate K8s + monitoring config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize + kubeconform
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz | tar xz
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          echo "$PWD" >> "$GITHUB_PATH"
      - name: kustomize build | kubeconform
        run: |
          for overlay in k8s/overlays/*/; do
            echo "::group::$overlay"
            # -ignore-missing-schemas: ExternalSecret CRDs have no upstream JSON schema
            kustomize build "$overlay" | kubeconform -strict -summary -ignore-missing-schemas -
            echo "::endgroup::"
          done
      - name: Alert rules (promtool)
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool prom/prometheus:v3.5.0 check rules /m/alert-rules.yml
      - name: docker compose config
        run: docker compose config --quiet
      - name: Helm chart lint + template | kubeconform
        run: |
          curl -sSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz | tar xz --strip-components=1 linux-amd64/helm
          ./helm lint helm/shopflow-service -f helm/values/order-service.yaml
          for v in helm/values/order-service.yaml helm/values/payment-service.yaml; do
            ./helm template svc helm/shopflow-service -f "$v" | kubeconform -strict -summary -
          done

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/aws
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.3"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false   # validate needs providers/modules, not the state bucket
      - run: terraform validate
      # a real deploy job would follow: assume the OIDC role (ci-oidc.tf), terraform plan on PRs,
      # apply on main behind a manual approval environment

  image:
    name: Image ${{ matrix.service }}
    needs: [test, validate-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to ghcr.io
      id-token: write          # OIDC token: AWS role (ci-oidc.tf) and keyless cosign signing
    strategy:
      matrix:
        service: [order-service, inventory-service, notification-service, payment-service]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/shopflow-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build (load locally for scanning)
        uses: docker/build-push-action@v7
        with:
          context: shopflow
          build-args: SERVICE=${{ matrix.service }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan image (fail on fixable HIGH/CRITICAL CVEs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Supply chain: an SBOM (what is inside the image) is kept with the build so a future CVE
      # can be answered with "which images contain log4j 2.14?" without rebuilding anything.
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.service }}.cdx.json
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: shopflow
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
      # Sign the pushed digest with the workflow's OIDC identity (keyless cosign). A cluster
      # admission policy (Kyverno / sigstore policy-controller) can then refuse unsigned images.
      - name: Install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v4
      - name: Sign image
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      # --- AWS: mirror the same image into ECR (EKS pulls from there). Runs only when the repository
      # variable AWS_ROLE_ARN is set to the role from `terraform output github_actions_role_arn`.
      # No access keys: GitHub's OIDC token is exchanged for 1-hour credentials (ci-oidc.tf).
      - name: Assume AWS role (OIDC)
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - name: Log in to ECR
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push to ECR
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        run: |
          SRC=${{ env.IMAGE }}:${{ github.sha }}
          DST=${{ steps.ecr.outputs.registry }}/shopflow/${{ matrix.service }}:${{ github.sha }}
          docker tag "$SRC" "$DST" && docker push "$DST"

  loadtest-syntax:
    name: k6 script compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: grafana/setup-k6-action@v1
      - run: k6 inspect shopflow/loadtest/flash-sale.js   # parses + evaluates options, no traffic

  deploy-manifests:
    name: Pin prod overlay to this build
    if: github.ref == 'refs/heads/main'
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commits the new image tags back to main
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz | tar xz
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Set image tags to the commit SHA
        working-directory: shopflow/k8s/overlays/prod
        run: |
          kustomize edit set image \
            shopflow/order-service=ghcr.io/${{ github.repository_owner }}/shopflow-order-service:${{ github.sha }} \
            shopflow/inventory-service=ghcr.io/${{ github.repository_owner }}/shopflow-inventory-service:${{ github.sha }} \
            shopflow/notification-service=ghcr.io/${{ github.repository_owner }}/shopflow-notification-service:${{ github.sha }} \
            shopflow/payment-service=ghcr.io/${{ github.repository_owner }}/shopflow-payment-service:${{ github.sha }}
          kustomize build . > /dev/null      # still renders?
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy(prod): pin images to ${GITHUB_SHA::7}"
          # pushes made with GITHUB_TOKEN do not trigger another workflow run, so this cannot loop
          git push
