server:
  port: 8082
  shutdown: graceful            # finish in-flight requests on SIGTERM (K8s pod termination)

spring:
  application:
    name: inventory-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cache:
    type: ${CACHE_TYPE:simple}   # 'redis' in compose/K8s (shared across pods), 'simple' = local ConcurrentHashMap
    redis:
      time-to-live: 60s          # safety net if an eviction is ever missed
      key-prefix: "inventory:"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD:inventory}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false          # no lazy loading in the web layer
    hibernate:
      ddl-auto: validate         # schema is owned by Flyway, Hibernate only checks it
  mvc:
    problemdetails:
      enabled: true

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH:false}  # only meaningful when CACHE_TYPE=redis
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness and /readiness for K8s
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
