server:
  port: 8081
  shutdown: graceful            # finish in-flight requests on SIGTERM (K8s pod termination)

spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true             # Java 21: blocking IO (DB, HTTP to inventory) no longer pins a platform thread
  lifecycle:
    timeout-per-shutdown-phase: 20s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all                 # leader + all in-sync replicas have the record before we mark it published
      properties:
        enable.idempotence: true  # broker de-duplicates producer retries
    template:
      observation-enabled: true # trace context travels in the Kafka headers
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/shopflow}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

inventory:
  base-url: ${INVENTORY_URL:http://localhost:8082}
  connect-timeout: 1s
  read-timeout: 2s              # never wait forever on a downstream call

outbox:
  relay:
    delay: 1s

resilience4j:
  ratelimiter:
    instances:
      orders:
        limit-for-period: 50      # 50 order creations ...
        limit-refresh-period: 1s  # ... per second per pod
        timeout-duration: 0       # don't queue, fail fast with 429
  retry:
    instances:
      inventory:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:         # only transient technical errors are retried
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      inventory:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50              # open when >= 50% of the last 10 calls failed
        wait-duration-in-open-state: 10s        # then fail fast for 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - com.shopflow.order.inventory.InventoryRejectedException

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE:1.0}   # 100% locally; 0.1 is typical in prod
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # only own dependencies: if inventory is down, order pods must NOT be pulled
        # from the load balancer (that would turn one outage into two)
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
