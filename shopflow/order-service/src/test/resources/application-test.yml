spring:
  datasource:
    url: jdbc:h2:mem:orders;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://test-issuer/realms/shopflow

jwt:
  audience: shopflow-web

inventory:
  read-timeout: 500ms

outbox:
  relay:
    delay: 100ms

orders:
  reconcile:
    delay: 1h                   # tests call reconcileFailedOrders()/countStuckConfirmed() directly
    grace: 0s
  stuck:
    grace: 0s

resilience4j:
  retry:
    instances:
      inventory:
        wait-duration: 10ms

ratelimit:
  # effectively off for the integration tests that POST many orders under one mock JWT sub — the
  # rate limiter's own behaviour is covered deterministically by OrderRateLimitFilterTest instead.
  backend: LOCAL
  capacity: 1000000
  refill-per-second: 1000000

management:
  otlp:
    tracing:
      export:
        enabled: false
