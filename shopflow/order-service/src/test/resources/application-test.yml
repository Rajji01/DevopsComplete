spring:
  datasource:
    url: jdbc:h2:mem:orders;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://test-issuer/realms/shopflow

inventory:
  read-timeout: 500ms

outbox:
  relay:
    delay: 100ms

resilience4j:
  retry:
    instances:
      inventory:
        wait-duration: 10ms

management:
  otlp:
    tracing:
      export:
        enabled: false
