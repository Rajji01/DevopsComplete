name: payment-service
image:
  repository: shopflow/payment-service
port: 8084
db:
  name: payments
  secretKey: payments-db-password
env:
  - name: KAFKA_BOOTSTRAP_SERVERS
    valueFrom:
      configMapKeyRef:
        name: shopflow-endpoints
        key: kafka-bootstrap-servers
  - name: OTLP_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: shopflow-endpoints
        key: otlp-endpoint
