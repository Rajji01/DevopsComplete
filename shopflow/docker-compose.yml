# Local production-like stack:  docker compose up --build
#   order-service      http://localhost:8081/swagger-ui.html
#   inventory-service  http://localhost:8082/swagger-ui.html
#   prometheus         http://localhost:9090
#   grafana            http://localhost:3000  (admin / admin)
name: shopflow

x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  deploy:
    resources:
      limits:
        memory: 512m

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      ORDERS_DB_PASSWORD: orders
      INVENTORY_DB_PASSWORD: inventory
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./k8s/base/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  inventory-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: inventory-service
    image: shopflow/inventory-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      DB_USERNAME: inventory
      DB_PASSWORD: inventory
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      start_period: 40s

  order-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: order-service
    image: shopflow/order-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USERNAME: orders
      DB_PASSWORD: orders
      INVENTORY_URL: http://inventory-service:8082
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      start_period: 40s

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:
