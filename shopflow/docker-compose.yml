# Local production-like stack:  docker compose up --build
#   order-service         http://localhost:8081/swagger-ui.html   (needs a JWT, see README)
#   inventory-service     http://localhost:8082/swagger-ui.html
#   notification-service  http://localhost:8083/actuator/health
#   payment-service       http://localhost:8084/actuator/health
#   keycloak              http://localhost:8180  (admin / admin; realm "shopflow", users alice/alice, bob/bob)
#   prometheus            http://localhost:9090
#   grafana               http://localhost:3000  (admin / admin: metrics, traces and logs wired together)
name: shopflow

x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  deploy:
    resources:
      limits:
        memory: 512m

x-service-env: &service-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  OTLP_ENDPOINT: http://tempo:4318/v1/traces
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_PASSWORD: postgres
      ORDERS_DB_PASSWORD: orders
      INVENTORY_DB_PASSWORD: inventory
      NOTIFICATIONS_DB_PASSWORD: notifications
      PAYMENTS_DB_PASSWORD: payments
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./k8s/base/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  # single-node Kafka in KRaft mode (no ZooKeeper). Production: Amazon MSK (see infra/terraform/aws).
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3                 # default partitions for auto-created topics
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 12
    volumes:
      - kafkadata:/tmp/kraft-combined-logs

  # shared cache for inventory-service. Production: Amazon ElastiCache.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # identity provider issuing the JWTs order-service validates. Production: Amazon Cognito (or Keycloak on EKS).
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180      # issuer in the tokens must match what order-service expects
    volumes:
      - ./k8s/base/keycloak/shopflow-realm.json:/opt/keycloak/data/import/shopflow-realm.json:ro
    ports:
      - "8180:8180"

  inventory-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: inventory-service
    image: shopflow/inventory-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      DB_USERNAME: inventory
      DB_PASSWORD: inventory
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_HEALTH: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      start_period: 40s

  order-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: order-service
    image: shopflow/order-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USERNAME: orders
      DB_PASSWORD: orders
      INVENTORY_URL: http://inventory-service:8082
      JWT_ISSUER_URI: http://localhost:8180/realms/shopflow   # same host the browser/curl uses to get tokens
    extra_hosts:
      - "localhost:host-gateway"   # lets the container reach keycloak's JWKS via the issuer host
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      start_period: 40s

  notification-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: notification-service
    image: shopflow/notification-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/notifications
      DB_USERNAME: notifications
      DB_PASSWORD: notifications
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health/readiness"]
      interval: 10s
      start_period: 40s

  payment-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: payment-service
    image: shopflow/payment-service:local
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/payments
      DB_USERNAME: payments
      DB_PASSWORD: payments
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health/readiness"]
      interval: 10s
      start_period: 40s

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo.yml:ro
      - tempodata:/var/tempo

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local-config.yaml"]

  alloy:
    image: grafana/alloy:v1.10.0
    command: ["run", "/etc/alloy/config.river"]
    volumes:
      - ./monitoring/alloy.river:/etc/alloy/config.river:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:
  kafkadata:
  tempodata:
