# External Secrets Operator syncs the DB credentials from AWS Secrets Manager into the K8s Secret
# "shopflow-db" that the Deployments already reference. Git never contains a password.
# The operator's ServiceAccount gets AWS permissions through IRSA (infra/terraform/aws/irsa.tf).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shopflow-db
spec:
  refreshInterval: 1h          # rotated secrets are picked up within an hour
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: shopflow-db
  data:
    - secretKey: orders-db-password
      remoteRef:
        key: shopflow/prod/db   # one JSON secret with three keys, created by Terraform
        property: orders
    - secretKey: inventory-db-password
      remoteRef:
        key: shopflow/prod/db
        property: inventory
    - secretKey: notifications-db-password
      remoteRef:
        key: shopflow/prod/db
        property: notifications
    - secretKey: payments-db-password
      remoteRef:
        key: shopflow/prod/db
        property: payments
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/shopflow-external-secrets   # from terraform output
