# IRSA: the EKS pod-identity webhook sees the role annotation and mounts a projected token;
# the AWS SDK / aws-msk-iam-auth exchange it at STS for temporary credentials scoped to that role.
# (It works with automountServiceAccountToken: false; the webhook adds its own volume.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/shopflow-kafka-clients   # terraform output kafka_clients_role_arn
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/shopflow-kafka-clients
