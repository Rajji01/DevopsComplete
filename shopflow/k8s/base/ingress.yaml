# Needs an ingress controller (minikube addons enable ingress)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopflow
spec:
  ingressClassName: nginx
  rules:
    - host: shopflow.local
      http:
        paths:
          - path: /api/v1/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  name: http
          - path: /api/v1/products
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  name: http
