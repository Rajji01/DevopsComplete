# Nightly logical backup of every database. Dev: into a PVC. Prod on AWS: not needed, RDS takes
# automated snapshots + PITR (rds.tf); the prod overlay deletes this with the rest of the in-cluster
# Postgres. Restore procedure: docs/runbooks/RestorePostgres.md
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres-backup
spec:
  schedule: "15 2 * * *"           # 02:15 UTC = 07:45 IST, after the day's traffic
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            fsGroup: 70
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  ts=$(date +%Y%m%d-%H%M)
                  for db in orders inventory notifications payments; do
                    pg_dump -h postgres -U postgres -Fc "$db" > "/backups/$db-$ts.dump"
                  done
                  # keep 7 days; a failed dump above aborts before deleting anything (set -e)
                  find /backups -name '*.dump' -mtime +7 -delete
                  ls -lh /backups | tail -n 8
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: shopflow-db
                      key: postgres-password
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
