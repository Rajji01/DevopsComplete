# Demo database inside the cluster. In real production use a managed DB (RDS / Cloud SQL)
# or an operator (CloudNativePG) for backups, failover and upgrades.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        fsGroup: 70                      # postgres user in the alpine image
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "max_connections=200"]   # default 100 is too low for 2 services x 10 pods x pool 5
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-db
                  key: postgres-password
            - name: ORDERS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-db
                  key: orders-db-password
            - name: INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-db
                  key: inventory-db-password
            - name: NOTIFICATIONS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-db
                  key: notifications-db-password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
  # one PersistentVolumeClaim per replica, kept when the pod is rescheduled
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
