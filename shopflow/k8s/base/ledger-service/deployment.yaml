apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  labels:
    app.kubernetes.io/name: ledger-service
spec:
  # no spec.replicas: the HPA owns the count. Setting it here would reset the
  # replica count on every 'kubectl apply' and fight the autoscaler.
  revisionHistoryLimit: 5                # how far back 'kubectl rollout undo' can go
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0                  # never drop below desired capacity during a deploy
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8085"
    spec:
      automountServiceAccountToken: false  # the app never talks to the K8s API
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # spread replicas over nodes so one node failure does not take every pod
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ledger-service
      containers:
        - name: ledger-service
          image: shopflow/ledger-service
          ports:
            - name: http
              containerPort: 8085
          env:
            # 5 services now (Walk 121): worst case 5 x HPA max x pool shares one Postgres.
            # base 5 x 6 x 5 = 150 < 200 (compose max_connections); prod 5 x 10 x 5 = 250 < RDS 300 (Walk 65)
            - name: DB_POOL_SIZE
              value: "5"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/ledger
            - name: DB_USERNAME
              value: ledger
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-db
                  key: ledger-db-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: shopflow-endpoints
                  key: kafka-bootstrap-servers
            - name: OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: shopflow-endpoints
                  key: otlp-endpoint
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs                 # JSON logs for Loki / ELK
          resources:
            requests:                    # what the scheduler reserves (and HPA % is based on)
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 512Mi              # over this -> OOMKilled; heap = 75% of it (Dockerfile)
              # no CPU limit on purpose: CPU limits cause throttling and slow JVM start-up
          # startup: give the JVM up to 60s before liveness starts judging it
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # liveness: restart the container if the app is stuck
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # readiness: only send traffic when the app and its own DB are OK
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # keep serving for a few seconds while endpoints/ingress stop routing to this pod,
              # then SIGTERM triggers Spring's graceful shutdown
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp            # Tomcat needs a writable temp dir
      volumes:
        - name: tmp
          emptyDir: {}
