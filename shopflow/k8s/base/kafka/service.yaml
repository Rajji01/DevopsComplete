apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  clusterIP: None   # headless: kafka-0.kafka for the controller quorum, kafka for clients
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: kafka
      port: 9092
    - name: controller
      port: 9093
