# Dev identity provider with the shopflow realm imported. Production uses Amazon Cognito
# (infra/terraform/aws/cognito.tf); the prod overlay deletes this and changes JWT_ISSUER_URI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.3
          args: ["start-dev", "--import-realm", "--http-port=8180"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            # Pinned to the IN-CLUSTER url (Walk 80): KC_HOSTNAME fixes the `iss` in every token no
            # matter which host the browser used. Only order-service validates iss and fetches JWKS,
            # and `keycloak:8180` is what IT can resolve — `keycloak.shopflow.local` only exists in
            # the laptop's /etc/hosts, so with the old value the pod's JWKS fetch failed and every
            # authenticated call 401'd (lazily, after a healthy-looking startup). The browser doesn't
            # care what iss says; it just needs the token endpoint to answer (strict=false allows
            # reaching it via the ingress host).
            - name: KC_HOSTNAME
              value: http://keycloak:8180
            - name: KC_HOSTNAME_STRICT
              value: "false"
          ports:
            - name: http
              containerPort: 8180
          startupProbe:
            httpGet:
              path: /realms/shopflow
              port: http
            periodSeconds: 5
            failureThreshold: 36
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
