apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shopflow
labels:
  - pairs:
      app.kubernetes.io/part-of: shopflow
    includeSelectors: false
resources:
  - namespace.yaml
  - endpoints-configmap.yaml
  - postgres
  - kafka
  - redis
  - keycloak
  - inventory-service
  - order-service
  - notification-service
  - ingress.yaml
  - network-policies.yaml
