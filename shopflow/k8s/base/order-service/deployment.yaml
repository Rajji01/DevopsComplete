apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
spec:
  replicas: 2
  revisionHistoryLimit: 5                # how far back 'kubectl rollout undo' can go
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0                  # never drop below desired capacity during a deploy
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      automountServiceAccountToken: false  # the app never talks to the K8s API
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # spread replicas over nodes so one node failure does not take every pod
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
      containers:
        - name: order-service
          image: shopflow/order-service
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/orders
            - name: DB_USERNAME
              value: orders
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopflow-db
                  key: orders-db-password
            - name: INVENTORY_URL
              value: http://inventory-service:8082   # K8s DNS name of the Service
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs                 # JSON logs for Loki / ELK
          resources:
            requests:                    # what the scheduler reserves (and HPA % is based on)
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 512Mi              # over this -> OOMKilled; heap = 75% of it (Dockerfile)
              # no CPU limit on purpose: CPU limits cause throttling and slow JVM start-up
          # startup: give the JVM up to 60s before liveness starts judging it
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # liveness: restart the container if the app is stuck
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # readiness: only send traffic when the app and its own DB are OK
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # keep serving for a few seconds while endpoints/ingress stop routing to this pod,
              # then SIGTERM triggers Spring's graceful shutdown
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp            # Tomcat needs a writable temp dir
      volumes:
        - name: tmp
          emptyDir: {}
