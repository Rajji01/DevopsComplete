apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce   # Audit = only report; Enforce = reject the manifest
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: "an image tag is required (a digest or the git SHA); ':latest' and untagged images are not traceable"
        pattern:
          spec:
            containers:
              - image: "*:*"
            # =( ) is a conditional anchor: validate initContainers/ephemeralContainers only when present.
            # Without these, a :latest/untagged initContainer slipped straight through (Walk 16).
            "=(initContainers)":
              - image: "*:*"
            "=(ephemeralContainers)":
              - image: "*:*"
    - name: disallow-latest
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: "':latest' cannot be rolled back; use the git SHA tag CI writes into the overlay"
        pattern:
          spec:
            containers:
              - image: "!*:latest"
            "=(initContainers)":
              - image: "!*:latest"
            "=(ephemeralContainers)":
              - image: "!*:latest"
