# OPA Gatekeeper version of "no :latest". Rego instead of YAML patterns; validate-only.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowlatesttag
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowLatestTag
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowlatesttag

        # all container types in one set so init/ephemeral containers can't sneak a :latest past us
        # (Walk 16 — this matched the Kyverno policy, which only checked spec.containers before).
        # Absent initContainers/ephemeralContainers simply contribute nothing.
        all_containers[c] { c := input.review.object.spec.containers[_] }
        all_containers[c] { c := input.review.object.spec.initContainers[_] }
        all_containers[c] { c := input.review.object.spec.ephemeralContainers[_] }

        violation[{"msg": msg}] {
          c := all_containers[_]
          endswith(c.image, ":latest")
          msg := sprintf("container %v uses ':latest' which cannot be rolled back", [c.name])
        }

        violation[{"msg": msg}] {
          c := all_containers[_]
          not contains(c.image, ":")
          not contains(c.image, "@")
          msg := sprintf("container %v has no tag or digest", [c.name])
        }
