# The gate between canary steps: fail the rollout if the canary's 5xx ratio is above 2%
# for 3 consecutive measurements.
# canary-hash is the CANARY ReplicaSet's pod-template hash (passed by the Rollout via
# podTemplateHashValue: Latest). Filtering on the specific hash matters: Rollouts puts
# rollouts-pod-template-hash on the STABLE pods too (it manages both ReplicaSets with it), so the
# old `!=""` filter measured stable+canary together — a canary at 10% weight serving 15% errors
# only moved the blended ratio to ~1.5% < 2% and would have been promoted (Walk 51).
# Prometheus must labelmap pod labels for rollouts_pod_template_hash to exist on app metrics.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-ratio
spec:
  args:
    - name: service
    - name: canary-hash
  metrics:
    - name: error-ratio
      interval: 1m
      count: 5
      successCondition: result[0] < 0.02
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus.monitoring:9090
          query: |
            sum(rate(http_server_requests_seconds_count{application="{{args.service}}",
                     status=~"5..", uri!~"/actuator.*",
                     rollouts_pod_template_hash="{{args.canary-hash}}"}[2m]))
            /
            sum(rate(http_server_requests_seconds_count{application="{{args.service}}",
                     uri!~"/actuator.*",
                     rollouts_pod_template_hash="{{args.canary-hash}}"}[2m]))
