# Routing: WHO gets WHAT, HOW. Without this, alerts only exist on the Prometheus /alerts page.
#   severity=page   -> PagerDuty (wakes someone up) + Slack #shopflow-incidents
#   severity=ticket -> Slack #shopflow-alerts only (looked at during working hours)
# Secrets (PagerDuty key, Slack webhook) come from env/files mounted at runtime, never from git.
global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/secrets/slack-webhook   # created by compose/ESO; a dummy file locally

route:
  receiver: slack-alerts                 # default: everything at least reaches Slack
  group_by: ["alertname", "application"] # one notification per problem, not per pod
  group_wait: 30s                        # wait for siblings before the first notification
  group_interval: 5m                     # batch new alerts of an existing group
  repeat_interval: 4h                    # remind if still firing
  routes:
    - matchers: ["severity = page"]
      receiver: pagerduty-oncall
      continue: true                     # page AND post to Slack
    - matchers: ["severity = page"]
      receiver: slack-incidents
    - matchers: ["severity = ticket"]
      receiver: slack-alerts
      repeat_interval: 24h

# When a service is down, do not also page about its error rate / latency / breaker: one page, one cause.
inhibit_rules:
  - source_matchers: ["alertname = ServiceDown"]
    target_matchers: ["alertname =~ HighErrorRate|HighP99Latency|InventoryCircuitOpen|CheckoutSLOBurnRate.*"]
    equal: ["application"]
  - source_matchers: ["alertname = CheckoutSLOBurnRateFast"]
    target_matchers: ["alertname = CheckoutSLOBurnRateSlow"]

receivers:
  - name: pagerduty-oncall
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty-key
        severity: critical
        description: '{{ .CommonAnnotations.summary }}'
        details:
          runbook: '{{ .CommonAnnotations.runbook }}'
  - name: slack-incidents
    slack_configs:
      - channel: "#shopflow-incidents"
        send_resolved: true
        title: ':rotating_light: {{ .CommonLabels.alertname }} ({{ .CommonLabels.application }})'
        text: '{{ .CommonAnnotations.summary }}{{ if .CommonAnnotations.runbook }}\nRunbook: {{ .CommonAnnotations.runbook }}{{ end }}'
  - name: slack-alerts
    slack_configs:
      - channel: "#shopflow-alerts"
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.application }})'
        text: '{{ .CommonAnnotations.summary }}'
