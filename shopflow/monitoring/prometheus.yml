global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: shopflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8081", "inventory-service:8082", "notification-service:8083"]
