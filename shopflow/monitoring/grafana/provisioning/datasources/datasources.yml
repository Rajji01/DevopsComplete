apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:                 # click a span -> see that trace's log lines in Loki
        datasourceUid: loki
        filterByTraceID: true
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    jsonData:
      derivedFields:                  # click a trace id in a log line -> open the trace in Tempo
        - name: trace
          matcherRegex: '"trace\.id":"(\w+)"'
          url: "$${__value.raw}"
          datasourceUid: tempo
