# Alerts on symptoms users feel (errors, latency), plus the circuit breaker as an early cause signal.
groups:
  - name: shopflow
    rules:
      - alert: HighErrorRate
        # uses the recorded ratio so alert + dashboard share ONE definition (Walk 74). The old inline
        # expr had no uri exclusion: actuator scrapes + kubelet probes inflated the denominator, so a
        # low-traffic service needed well over 5% business-request failures before this paged
        expr: service:http_error_ratio:rate5m > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.application }}: more than 5% of requests fail with 5xx"
          runbook: docs/runbooks/HighErrorRate.md

      - alert: HighP99Latency
        # same single-definition rule as HighErrorRate: the recorded p99, not a private copy (Walk 74)
        expr: service:http_latency_p99:5m > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.application }}: p99 latency above 1s"
          runbook: docs/runbooks/HighP99Latency.md

      - alert: InventoryCircuitOpen
        # the breaker cycles open -> half_open every 10s, so the 'state' gauge flaps; the counter of
        # calls it rejected keeps rising for as long as the breaker is doing its job
        expr: sum by (application) (rate(resilience4j_circuitbreaker_not_permitted_calls_total{name="inventory"}[5m])) > 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "order-service stopped calling inventory-service (circuit breaker open)"
          runbook: docs/runbooks/InventoryCircuitOpen.md

      - alert: ServiceDown
        expr: up{job="shopflow"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }} is not being scraped"
          runbook: docs/runbooks/ServiceDown.md

      - alert: OutboxBacklogGrowing
        # events written but not yet published to Kafka: broker down, or the relay is stuck
        expr: max by (application) (outbox_unpublished) > 100
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.application }}: more than 100 order events waiting in the outbox"
          runbook: docs/runbooks/OutboxBacklogGrowing.md

      - alert: KafkaConsumerLagHigh
        # notification-service is falling behind the producers
        # metric from Micrometer's Kafka consumer binder (kafka.consumer.fetch.manager.records.lag.max)
        expr: sum by (application) (kafka_consumer_fetch_manager_records_lag_max) > 1000
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.application }}: Kafka consumer lag above 1000 records"
          runbook: docs/runbooks/KafkaConsumerLagHigh.md

      - alert: OrdersStuckConfirmed
        # CONFIRMED/REFUND_PENDING orders whose payment/refund event never arrived. We do NOT auto-cancel
        # these (payment may be in flight), so a human must look: payment-service down? consumer lag?
        expr: max(orders_stuck_confirmed) > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "orders stuck in CONFIRMED/REFUND_PENDING past the grace period (payment/refund event missing)"
          runbook: docs/runbooks/OrdersStuckConfirmed.md

      - alert: PaymentFailureRateHigh
        # declined cards are normal; most of them failing in 10 minutes means the gateway or our pricing is broken
        expr: |
          sum(rate(payments_total{status="FAILED"}[10m])) / sum(rate(payments_total[10m])) > 0.5
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "more than half of all payments are failing"
          runbook: docs/runbooks/PaymentFailureRateHigh.md

      - alert: PaymentRefundFailed
        # the processor DECLINED a refund (Walk 20): the order stays REFUND_PENDING and the money is
        # still with us. Rare and always needs a human — no retry loop fixes a declined refund — so we
        # alert on any occurrence, faster and more specific than the OrdersStuckConfirmed backstop.
        expr: sum(increase(payments_refund_failed_total[15m])) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "a refund was declined by the processor (order stuck in REFUND_PENDING, money not returned)"
          runbook: docs/runbooks/PaymentRefundFailed.md

      - alert: KafkaMessageDeadLettered
        # a record exhausted its retries and was moved to a .DLT topic (Walk 40). Nothing consumes
        # the DLTs, so without this alert a dead-lettered event (an order email, a payment event) is
        # silently lost until someone notices the side effect missing. Any occurrence needs a human:
        # inspect the DLT record, fix the bug/data, replay. Counter lives in each service's
        # KafkaErrorConfig and only increments after the DLT publish succeeded.
        expr: sum by (application) (increase(kafka_dead_lettered_total[15m])) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.application }} dead-lettered a Kafka record (event lost until replayed from the DLT)"
          runbook: docs/runbooks/KafkaMessageDeadLettered.md
