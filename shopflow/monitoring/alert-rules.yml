# Alerts on symptoms users feel (errors, latency), plus the circuit breaker as an early cause signal.
groups:
  - name: shopflow
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.application }}: more than 5% of requests fail with 5xx"

      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum by (application, le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))) > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.application }}: p99 latency above 1s"

      - alert: InventoryCircuitOpen
        # the breaker cycles open -> half_open every 10s, so the 'state' gauge flaps; the counter of
        # calls it rejected keeps rising for as long as the breaker is doing its job
        expr: sum by (application) (rate(resilience4j_circuitbreaker_not_permitted_calls_total{name="inventory"}[5m])) > 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "order-service stopped calling inventory-service (circuit breaker open)"

      - alert: ServiceDown
        expr: up{job="shopflow"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }} is not being scraped"

      - alert: OutboxBacklogGrowing
        # events written but not yet published to Kafka: broker down, or the relay is stuck
        expr: max by (application) (outbox_unpublished) > 100
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.application }}: more than 100 order events waiting in the outbox"

      - alert: KafkaConsumerLagHigh
        # notification-service is falling behind the producers
        # metric from Micrometer's Kafka consumer binder (kafka.consumer.fetch.manager.records.lag.max)
        expr: sum by (application) (kafka_consumer_fetch_manager_records_lag_max) > 1000
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.application }}: Kafka consumer lag above 1000 records"
