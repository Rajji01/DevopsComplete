# Recording rules: pre-compute the RED numbers every dashboard and alert needs, so Grafana panels
# are cheap and every alert uses the same definition of "error rate". Naming: level:metric:operations.
groups:
  - name: shopflow-red
    interval: 15s
    rules:
      - record: service:http_requests:rate5m
        expr: sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
      - record: service:http_errors:rate5m
        expr: sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*", status=~"5.."}[5m]))
      - record: service:http_error_ratio:rate5m
        expr: service:http_errors:rate5m / service:http_requests:rate5m
      - record: service:http_latency_p99:5m
        expr: histogram_quantile(0.99, sum by (application, le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m])))

  # SLI for the checkout SLO. VALID attempts = 2xx (success, incl. a business REJECTED which is 201)
  # or 5xx (server error). "bad" = 5xx OR slower than 1s. 4xx (client error) and 429 (rate limited —
  # our own protection) are the client's problem: excluded from BOTH numerator and denominator, so a
  # flash-sale burst of 429s neither counts against the SLO nor dilutes the ratio. (status=~"[25].." .)
  - name: shopflow-sli
    interval: 15s
    rules:
      - record: sli:checkout_requests:rate5m
        expr: sum(rate(http_server_requests_seconds_count{application="order-service", uri="/api/v1/orders", method="POST", status=~"[25].."}[5m]))
      - record: sli:checkout_bad:rate5m
        expr: |
          sum(rate(http_server_requests_seconds_count{application="order-service", uri="/api/v1/orders", method="POST", status=~"5.."}[5m]))
          + (
              sum(rate(http_server_requests_seconds_count{application="order-service", uri="/api/v1/orders", method="POST", status=~"2.."}[5m]))
            - sum(rate(http_server_requests_seconds_bucket{application="order-service", uri="/api/v1/orders", method="POST", status=~"2..", le="1.0"}[5m]))
          )
      - record: sli:checkout_error_ratio:rate5m
        expr: sli:checkout_bad:rate5m / sli:checkout_requests:rate5m
      - record: sli:checkout_error_ratio:rate30m
        expr: |
          (sum(rate(http_server_requests_seconds_count{application="order-service", uri="/api/v1/orders", method="POST", status=~"5.."}[30m]))
          + (sum(rate(http_server_requests_seconds_count{application="order-service", uri="/api/v1/orders", method="POST", status=~"2.."}[30m]))
             - sum(rate(http_server_requests_seconds_bucket{application="order-service", uri="/api/v1/orders", method="POST", status=~"2..", le="1.0"}[30m]))))
          / sum(rate(http_server_requests_seconds_count{application="order-service", uri="/api/v1/orders", method="POST", status=~"[25].."}[30m]))
      - record: sli:checkout_error_ratio:rate1h
        expr: |
          (sum(rate(http_server_requests_seconds_count{application="order-service", uri="/api/v1/orders", method="POST", status=~"5.."}[1h]))
          + (sum(rate(http_server_requests_seconds_count{application="order-service", uri="/api/v1/orders", method="POST", status=~"2.."}[1h]))
             - sum(rate(http_server_requests_seconds_bucket{application="order-service", uri="/api/v1/orders", method="POST", status=~"2..", le="1.0"}[1h]))))
          / sum(rate(http_server_requests_seconds_count{application="order-service", uri="/api/v1/orders", method="POST", status=~"[25].."}[1h]))
      - record: sli:checkout_error_ratio:rate6h
        expr: |
          (sum(rate(http_server_requests_seconds_count{application="order-service", uri="/api/v1/orders", method="POST", status=~"5.."}[6h]))
          + (sum(rate(http_server_requests_seconds_count{application="order-service", uri="/api/v1/orders", method="POST", status=~"2.."}[6h]))
             - sum(rate(http_server_requests_seconds_bucket{application="order-service", uri="/api/v1/orders", method="POST", status=~"2..", le="1.0"}[6h]))))
          / sum(rate(http_server_requests_seconds_count{application="order-service", uri="/api/v1/orders", method="POST", status=~"[25].."}[6h]))
