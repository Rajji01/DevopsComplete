spring:
  datasource:
    url: jdbc:h2:mem:ledger;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate       # Flyway migrates H2, Hibernate validates the entities against it
  kafka:
    listener:
      auto-startup: false      # no broker in the test: start no consumer container, call the
                               # listener method directly (its idempotency + posting is the logic
                               # under test, not Kafka wiring — that is covered by the shared
                               # embedded-Kafka tests in the saga-driving services)
