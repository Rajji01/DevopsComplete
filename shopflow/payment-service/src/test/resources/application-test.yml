spring:
  datasource:
    url: jdbc:h2:mem:payments;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

payment:
  refund-limit: 50000     # tests: AIRPODS refund (24900) succeeds; a PS5 refund (54990) is declined

outbox:
  relay:
    delay: 100ms

management:
  otlp:
    tracing:
      export:
        enabled: false
