# Values come from env vars (Dockerfile ENV / K8s ConfigMap); defaults keep local runs and tests working.
testing.property=${TESTING_PROPERTY:local-default}
host.port=${HOST_PORT:9092}
# Helper microservice reached through its ClusterIP service (see microservice01/helper-service.yaml)
helper.service.url=http://${HELPER_SERVICE:helper-service}:8088
# Raw ClusterIP of helper-service (check with `k get svc`), used by /api/m2 to demo IP-based access
helper.service.cluster-ip-url=http://${HELPER_CLUSTER_IP:10.100.13.14}:8088
