# yamllint: every YAML in the repo (manifests, compose, CI, Ansible). Helm templates are Go
# templates, not YAML, so they are excluded; `helm lint` covers them.
extends: default
ignore: |
  shopflow/helm/*/templates/
  shopflow/**/target/
rules:
  line-length:
    max: 160
    allow-non-breakable-inline-mappings: true
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  indentation:
    indent-sequences: consistent
