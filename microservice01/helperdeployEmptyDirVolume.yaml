apiVersion: apps/v1
kind: Deployment
metadata:
  name: helper-micro001
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: helper-micro001
  template:
    metadata:
      labels:
        app: helper-micro001
    spec:
      containers:
        - name: helper-micro001
          image: rajji01/backend-micro002:emptydir
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: cache-volume
              mountPath: /cache
          command: ["/bin/sh"]
          # write the file into the shared emptyDir, then start the app so GET /api2/readFile can serve it
          args: ["-c", "echo 'This file is created by the deployment at start.' > /cache/myfile.txt && exec java -jar /app/app.jar"]
      volumes:
        - name: cache-volume
          emptyDir: {}
